<style>
  :root {
    --ink: #0b0b0c; --panel: #151517; --raise: #1e1e21; --paper: #f3eee4; --hush: rgba(243, 238, 228, .6);
    --faint: rgba(243, 238, 228, .38); --line: rgba(243, 238, 228, .13); --ember: #f0733a;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    --en: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --side: max(14px, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: #0b0b0c; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--jp); font-size: 14px; line-height: 1.6; letter-spacing: .02em; -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  svg { display: block; }

  /* A phone held upright: the picture, the tools under it, the tabs at the foot, as in the app. */
  #app { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(150px, 1fr) auto auto minmax(0, var(--panel-height, 320px)) auto; }

  /* Each part is given its row by name: the invitation to the app is not always there, and must not shift the rest. */
  .bar { grid-row: 1; } .stage { grid-row: 2; } .nudge { grid-row: 3; } .tools { grid-row: 4; } .panel { grid-row: 5; } .tabs { grid-row: 6; }
  .bar { display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) var(--side) 8px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand b { display: block; font-family: var(--en); font-size: 13.5px; letter-spacing: .12em; line-height: 1.2; white-space: nowrap; }
  .brand small { display: block; font-size: 10.5px; color: var(--ember); letter-spacing: .1em; line-height: 1.3; font-weight: 600; }
  .bar .about { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); color: var(--hush); font-family: var(--en); font-weight: 700; flex: none; }
  .store { flex: none; padding: 8px 15px; border-radius: 99px; background: var(--paper); color: #111; font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }

  .stage { position: relative; min-height: 0; display: flex; flex-direction: column; }
  .frame { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  #view { position: relative; display: block; border-radius: 6px; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .tag { position: absolute; left: 50%; top: max(10px, calc(50% - var(--ch, 100%) / 2 + 10px)); transform: translateX(-50%); max-width: calc(var(--cw, 100%) - 16px); margin: 0; padding: 4px 13px; border-radius: 99px; background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 11.5px; color: var(--paper); white-space: nowrap; pointer-events: none; transition: opacity .3s; }
  .tag.gone { opacity: 0; }
  /* A little of the colour of the look behind the photograph. */
  .frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, var(--glow, transparent), transparent 72%); opacity: .7; pointer-events: none; }
  /* The photograph made large: everything but the picture steps aside. A tap on the picture brings it back. */
  .grow { position: absolute; z-index: 3; right: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(243, 238, 228, .28); color: var(--paper); }
  .grow svg { width: 18px; height: 18px; }
  .grow .in, .big .grow .out { display: none; } .big .grow .in { display: block; }
  body.big :is(.bar, .tools, .panel, .tabs, .nudge, .samples) { display: none; }
  body.big #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  body.big .stage { grid-column: 1; grid-row: 1; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  body.big .grow { top: calc(10px + env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
  body.live .grow { display: none; }
  .samples { position: absolute; left: var(--side); bottom: 10px; display: flex; gap: 6px; }
  .samples button { width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid rgba(243, 238, 228, .5); background: #222 center / cover; box-shadow: 0 4px 14px rgba(0, 0, 0, .5); }
  .samples button.on { border-color: var(--paper); }
  .drop { position: absolute; inset: 8px; border: 2px dashed var(--ember); border-radius: 14px; background: rgba(11, 11, 12, .8); display: grid; place-items: center; font-size: 16px; font-weight: 700; pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .35s; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .fail { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 30px; text-align: center; background: var(--ink); }
  .fail h2 { margin: 0; font-family: var(--serif); font-size: 22px; }
  .fail p { margin: 0; color: var(--hush); }

  /* The camera: the same picture area, with the looks and the shutter under it. */
  .cam { display: none; padding: 10px 0 max(14px, env(safe-area-inset-bottom)); }
  body.live .cam { display: block; }
  body.live :is(.tools, .panel, .tabs, .nudge, .samples) { display: none; }
  body.live #app { grid-template-rows: auto minmax(0, 1fr); }
  .cam p { margin: 0 var(--side) 8px; font-size: 12px; color: var(--hush); text-align: center; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px var(--side); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .strip::-webkit-scrollbar { display: none; }
  .pill { flex: none; padding: 7px 14px; border-radius: 99px; border: 1px solid rgba(243, 238, 228, .28); background: rgba(243, 238, 228, .05); font-size: 13px; white-space: nowrap; }
  .pill.on { background: var(--paper); border-color: var(--paper); color: #111; font-weight: 700; }
  .fire { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 14px; padding: 0 var(--side); }
  .fire .round { width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(243, 238, 228, .3); display: grid; place-items: center; }
  .fire .round:last-child { justify-self: end; }
  .fire svg { width: 22px; height: 22px; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--paper); padding: 5px; background-clip: content-box; background-color: var(--paper); transition: transform .12s; }
  #shutter:active { transform: scale(.92); }

  .nudge { display: flex; align-items: center; gap: 10px; margin: 0 var(--side) 8px; padding: 9px 10px 9px 12px; border-radius: 14px; background: var(--raise); border: 1px solid rgba(240, 115, 58, .5); font-size: 12.5px; line-height: 1.45; }
  .nudge p { margin: 0; flex: 1; }
  .nudge a { flex: none; padding: 7px 13px; border-radius: 99px; background: var(--paper); color: #111; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .nudge button { flex: none; width: 26px; height: 26px; color: var(--hush); font-size: 18px; line-height: 1; }

  .tools { display: flex; gap: 8px; padding: 8px var(--side); }
  .tools button { height: 44px; border-radius: 99px; border: 1px solid rgba(243, 238, 228, .24); display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tools svg { width: 18px; height: 18px; flex: none; }
  .tools .wide { flex: 1; min-width: 0; }
  .tools .lead { background: var(--paper); border-color: var(--paper); color: #111; font-weight: 700; }
  .tools .icon { width: 44px; padding: 0; flex: none; }

  .panel { min-height: 0; margin: 0 max(8px, env(safe-area-inset-left)); border-radius: 22px 22px 0 0; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; overflow: hidden; }
  .pane { height: 100%; overflow-y: auto; padding: 16px 16px 26px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .pane h2 { margin: 0; font-family: var(--en); font-size: 19px; letter-spacing: .06em; }
  .pane h2:not(:first-child) { margin-top: 26px; }
  .pane .sub { margin: 2px 0 12px; font-size: 11.5px; color: var(--hush); }
  .pane .note { margin: 8px 0 6px; min-height: 2.9em; font-size: 11.5px; line-height: 1.45; color: var(--hush); }

  /* The wheel: the recipes round a ring, every look between them inside it. */
  .deck { position: relative; }
  .deck h2 { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }
  .corner { position: absolute; z-index: 1; right: 0; top: 0; display: grid; justify-items: center; gap: 3px; width: 48px; font-size: 10px; line-height: 1.2; white-space: nowrap; }
  .corner.low { right: auto; left: 0; top: auto; bottom: 0; }
  .corner span { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(243, 238, 228, .3); background: rgba(243, 238, 228, .05); display: grid; place-items: center; transition: background .2s, color .2s; }
  .corner svg { width: 20px; height: 20px; }
  .corner b { font-weight: 600; color: var(--hush); }
  .corner[aria-pressed="true"] span { background: var(--paper); border-color: var(--paper); color: #111; }
  .corner:active span { background: rgba(243, 238, 228, .2); }
  .mixline { margin: 6px 0 0; height: 18px; font-size: 11.5px; line-height: 18px; font-weight: 600; color: var(--ember); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .orbit { position: relative; width: var(--s, 250px); height: var(--s, 250px); margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .orbit::before { content: ""; position: absolute; inset: 16%; border-radius: 50%; box-shadow: 0 0 70px 26px var(--glow, transparent); pointer-events: none; }
  .field { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; outline: none; -webkit-touch-callout: none; }
  .field:active { cursor: grabbing; }
  .field:focus-visible { outline: 2px solid var(--ember); outline-offset: -2px; border-radius: 50%; }
  .node { position: absolute; width: var(--n, 38px); height: var(--n, 38px); margin: calc(var(--n, 38px) / -2) 0 0 calc(var(--n, 38px) / -2); border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(243, 238, 228, .25); background: #222; opacity: calc(.78 + .22 * var(--w, 0)); transform: scale(calc(1 + .22 * var(--w, 0))); transition: transform .18s, opacity .18s, border-color .18s; }
  .node canvas { display: block; width: 100%; height: 100%; }
  .node.on { border-color: var(--paper); }
  .looks { margin: 0 -16px; padding: 2px 16px; }
  .looks .pill { font-family: var(--en); font-size: 12px; letter-spacing: .06em; }

  .dial { display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 2px; margin-top: 10px; }
  .dial > span { font-size: 13px; }
  .dial .num { font-family: var(--en); font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; padding: 4px 0 4px 12px; }
  .dial.moved .num { color: var(--paper); }
  .dial.off { opacity: .35; pointer-events: none; }
  .dial input { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0; background: transparent; touch-action: pan-y; cursor: pointer; }
  .dial input::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--paper) var(--p, 0%), rgba(243, 238, 228, .2) var(--p, 0%)); }
  .dial input::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--paper) var(--p, 0%), rgba(243, 238, 228, .2) var(--p, 0%)); }
  .dial input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -9.5px; border-radius: 50%; background: var(--paper); border: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .dial input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--paper); border: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .dial input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 6px; }

  /* What only the app does: said plainly where the control would be, and opened on a tap. */
  .more { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(243, 238, 228, .03); text-align: left; }
  .more svg { width: 16px; height: 16px; flex: none; color: var(--ember); }
  .more b { display: block; font-size: 13.5px; }
  .more small { display: block; font-size: 11.5px; color: var(--hush); line-height: 1.45; }
  .more i { margin-left: auto; flex: none; font-style: normal; font-size: 11px; font-weight: 700; color: var(--ember); white-space: nowrap; }
  .price { margin-top: 14px; padding: 16px; border-radius: 16px; border: 1px solid rgba(240, 115, 58, .5); }
  .price strong { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.5; }
  .price p { margin: 6px 0 0; font-size: 12px; color: var(--hush); }
  .get { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; margin-top: 14px; padding: 10px 22px; border-radius: 99px; background: var(--paper); color: #111; font-weight: 700; font-size: 15.5px; text-decoration: none; letter-spacing: .04em; }
  .get svg { width: 20px; height: 20px; flex: none; }
  .small { margin: 10px 0 0; font-size: 11.5px; color: var(--hush); text-align: center; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 max(8px, env(safe-area-inset-left)); padding: 6px 6px max(6px, env(safe-area-inset-bottom)); background: var(--panel); border: 1px solid var(--line); border-top: 1px solid var(--line); }
  .tabs button { height: 40px; border-radius: 99px; font-family: var(--en); font-weight: 700; font-size: 11.5px; letter-spacing: .16em; color: var(--faint); }
  .tabs button.on { background: var(--raise); color: var(--paper); }
  .tabs button em { font-style: normal; color: var(--ember); }

  /* Sheets: what the app adds, the finished picture, the small print. */
  .veil { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; background: rgba(0, 0, 0, .62); animation: veil .2s; }
  @keyframes veil { from { opacity: 0; } }
  .sheet { position: relative; max-height: 92dvh; overflow-y: auto; padding: 22px 20px max(22px, env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: var(--panel); border: 1px solid var(--line); animation: rise .28s cubic-bezier(.2, .8, .2, 1); overscroll-behavior: contain; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .sheet .shut { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--raise); font-size: 20px; line-height: 1; color: var(--hush); z-index: 1; }
  .sheet .kicker { margin: 0 0 6px; font-family: var(--en); font-weight: 700; font-size: 11px; letter-spacing: .26em; color: var(--ember); }
  .sheet h2 { margin: 0; padding-right: 36px; font-family: var(--serif); font-size: 23px; line-height: 1.45; }
  .sheet h3 { margin: 20px 0 4px; font-size: 14px; }
  .sheet p { margin: 8px 0 0; color: var(--hush); font-size: 13.5px; }
  .sheet .shot { display: block; width: auto; max-width: 100%; max-height: 34dvh; margin: 4px auto 18px; border-radius: 14px; border: 1px solid var(--line); }
  .sheet .made { display: block; width: auto; max-width: 100%; max-height: 38dvh; margin: 0 auto 14px; border-radius: 10px; -webkit-touch-callout: default; }
  .sheet ul { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .sheet li { position: relative; margin-top: 6px; padding-left: 1.5em; }
  .sheet li::before { content: "✓"; position: absolute; left: 0; color: var(--ember); font-weight: 700; }
  .sheet .keep { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 99px; border: 1px solid rgba(243, 238, 228, .4); font-weight: 700; font-size: 14.5px; text-decoration: none; }
  .sheet .keep svg { width: 18px; height: 18px; }
  .sheet hr { margin: 20px 0 18px; border: 0; border-top: 1px solid var(--line); }
  .sheet nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px; font-size: 12.5px; color: var(--hush); }
  .sheet .qr { display: none; }
  .toast { position: fixed; z-index: 40; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 20px; text-wrap: balance; background: rgba(243, 238, 228, .96); color: #111; font-size: 13px; font-weight: 600; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: toast .25s; pointer-events: none; }
  @keyframes toast { from { transform: translate(-50%, 16px); opacity: 0; } }
  #lens { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

  /* The panel takes its share of the height, so a short screen still has room for the picture. */
  #app { --panel-height: clamp(210px, 41vh, 370px); }
  @supports (height: 1dvh) { #app { --panel-height: clamp(210px, 41dvh, 370px); } }

  /* A wide window: the picture on the left, everything else in a column beside it. */
  @media (min-width: 900px) {
    #app { grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
    .bar { grid-column: 1 / -1; grid-row: 1; padding: 12px 22px; }
    .stage { grid-column: 1; grid-row: 2 / 6; padding: 0 0 18px 22px; }
    .nudge { grid-column: 2; grid-row: 2; margin: 0 22px 10px 18px; }
    .tools { grid-column: 2; grid-row: 3; padding: 0 22px 10px 18px; }
    .panel { grid-column: 2; grid-row: 4; margin: 0 22px 0 18px; }
    .tabs { grid-column: 2; grid-row: 5; margin: 0 22px 18px 18px; border-radius: 0 0 22px 22px; }
    .samples { left: 34px; bottom: 30px; }
    body.live #app { grid-template-columns: minmax(0, 1fr); }
    body.live .stage { padding: 0 22px 10px; }
    .cam { max-width: 560px; margin: 0 auto; width: 100%; }
    .veil { align-items: center; justify-items: center; }
    .sheet { width: min(480px, 92vw); border-radius: 24px; }
    .toast { bottom: 40px; }
  }
  @media (min-width: 900px) and (hover: hover) {
    .sheet .qr { display: flex; align-items: center; gap: 14px; margin-top: 16px; font-size: 12.5px; color: var(--hush); }
    .sheet .qr img { width: 92px; height: 92px; border-radius: 8px; flex: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<div id="app">
  <header class="bar">
    <a class="brand" href="../" aria-label="POCKET COLOR の紹介ページへ">
      <img src="../assets/icon.png" alt="" width="32" height="32">
      <span><b>POCKET COLOR</b><small>Web体験版</small></span>
    </a>
    <button class="about" id="about" type="button" aria-label="このページについて">?</button>
    <a class="store" href="https://apps.apple.com/jp/app/pocket-color/id6816624728">アプリを入手</a>
  </header>

  <main class="stage">
    <div class="frame" id="frame">
      <canvas id="view" width="2" height="2" role="img" aria-label="現像中の写真"></canvas>
      <p class="tag" id="tag">長押しで元の写真</p>
      <button class="grow" id="grow" type="button" aria-pressed="false" aria-label="写真を大きく見る">
        <svg class="out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        <svg class="in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M3 21l7-7"/></svg>
      </button>
      <div class="samples" id="samples" role="group" aria-label="サンプル写真">
        <button type="button" data-sample="sample-1.jpg" style="background-image:url(sample-1.jpg)" aria-label="サンプル写真1 紅葉"></button>
        <button type="button" data-sample="sample-2.jpg" style="background-image:url(sample-2.jpg)" aria-label="サンプル写真2 植物"></button>
      </div>
      <div class="flash" id="flash"></div>
      <div class="drop" id="drop" hidden>ここに写真をドロップ</div>
      <div class="fail" id="fail" hidden>
        <h2>このブラウザでは体験版を動かせません</h2>
        <p>WebGL 2 に対応したブラウザ（Safari・Chromeの最新版）でお試しください。<br>アプリの内容は紹介ページでご覧いただけます。</p>
        <a class="get" href="../">アプリの紹介を見る</a>
      </div>
    </div>
    <div class="cam" id="cam">
      <p>仕上がりの色を見ながら、そのまま撮れます</p>
      <div class="strip" id="camStrip" role="group" aria-label="レシピ"></div>
      <div class="fire">
        <button class="round" id="camClose" type="button" aria-label="カメラを閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button id="shutter" type="button" aria-label="撮影する"></button>
        <button class="round" id="camFlip" type="button" aria-label="前後のカメラを切り替える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.500M4 20v-4.500h4.500"/></svg></button>
      </div>
    </div>
  </main>

  <aside class="nudge" id="nudge" hidden>
    <p>気に入ったら、続きはアプリで。<br>編集はぜんぶ無料です。</p>
    <a href="https://apps.apple.com/jp/app/pocket-color/id6816624728">無料で入手</a>
    <button type="button" id="nudgeShut" aria-label="閉じる">×</button>
  </aside>

  <nav class="tools" aria-label="写真">
    <button class="wide lead" id="pick" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>自分の写真</button>
    <button class="wide" id="shoot" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"><path d="M4 8h3l1.500-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.400"/></svg>カメラ</button>
    <button class="icon" id="reset" type="button" aria-label="すべての調整を初期状態に戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.500 12a7.500 7.500 0 1 0 2.300-5.400L4.500 9M4.500 4.500V9H9"/></svg></button>
    <button class="wide" id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.500-4.500M12 15l4.500-4.500M5 20h14"/></svg>保存</button>
  </nav>

  <section class="panel" id="panel" aria-label="調整"></section>

  <nav class="tabs" id="tabs" aria-label="工程">
    <button type="button" data-tab="look" class="on">LOOK</button>
    <button type="button" data-tab="light">LIGHT</button>
    <button type="button" data-tab="color">COLOR</button>
    <button type="button" data-tab="app"><em>APP</em></button>
  </nav>
</div>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="snap" accept="image/*" capture="environment" hidden>
<video id="lens" playsinline muted></video>
<noscript><p style="position:fixed;inset:0;display:grid;place-content:center;padding:30px;text-align:center;background:#0b0b0c">この体験版はJavaScriptを使います。<a href="../">アプリの紹介ページ</a>をご覧ください。</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
